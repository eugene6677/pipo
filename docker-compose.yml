services:
  discord-bot:
    container_name: discord-bot
    restart: unless-stopped

    working_dir: /app

    build: .

    env_file:
      - .env

    volumes:
      - ./:/app
      - /app/node_modules

    healthcheck:
      test: ["CMD-SHELL", "pgrep node || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    labels:
      - homepage.name=Discord Bot
      - homepage.group=Bots
      - homepage.icon=discord.png
      - homepage.description=Bot XP Discord

    networks:
      - proxy

networks:
  proxy:
    external: true